[package]
name = "runtime-bundler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
flate2 = "1.1"
libloading = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.23"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

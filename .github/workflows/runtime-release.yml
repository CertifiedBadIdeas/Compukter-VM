name: Runtime release

on:
  push:
    tags:
      - "v0.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Runtime tag identity to validate without publishing
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: runtime-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ffi_library: target/release/libcompukter_ffi.so
            jni_library: target/release/libcompukter_jni.so
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            ffi_library: target/release/compukter_ffi.dll
            jni_library: target/release/compukter_jni.dll
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      RUNTIME_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate Runtime identity
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNTIME_TAG" in
            v0.*.*) ;;
            *) echo "invalid Runtime tag: $RUNTIME_TAG" >&2; exit 1 ;;
          esac
          declared_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' runtime-version.toml)"
          test "$RUNTIME_TAG" = "v$declared_version"
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify workspace
        shell: bash
        run: bash tools/runtime-bundler/verify-workspace.sh
      - name: Build, smoke, package and inspect native Runtime
        id: native
        shell: bash
        run: >-
          bash tools/runtime-bundler/verify-native-runtime.sh
          "${{ matrix.target }}" "${{ matrix.ffi_library }}" "${{ matrix.jni_library }}" "$RUNTIME_TAG"
      - name: Upload temporary platform bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.platform }}-${{ github.sha }}
          path: target/runtime-release/${{ steps.native.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  bundles:
    name: Verify complete Runtime bundle set
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Download platform bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Reinspect and checksum release assets
        env:
          RUNTIME_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: bash tools/runtime-bundler/verify-runtime-bundles.sh release-assets "$RUNTIME_TAG"
      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-verified-${{ github.sha }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged Runtime
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-verified-${{ github.sha }}
          path: release-assets
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Compukter Runtime ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release-assets/*

name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v0.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional Runtime tag identity to validate without publishing
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: runtime-ci-${{ github.sha }}
  cancel-in-progress: false
  queue: max

jobs:
  resolve:
    name: Select verified Runtime build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_run: ${{ steps.reuse.outputs.source_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Find successful build of this exact commit
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}
        run: python tools/runtime-bundler/reuse_verified_runtime.py

  rust:
    needs: resolve
    if: needs.resolve.outputs.source_run == ''
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ffi_library: target/release/libcompukter_ffi.so
            jni_library: target/release/libcompukter_jni.so
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ffi_library: target/release/compukter_ffi.dll
            jni_library: target/release/compukter_jni.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUNTIME_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Verify workspace
        shell: bash
        run: bash tools/runtime-bundler/verify-workspace.sh
      - name: Build, smoke, package and inspect native Runtime
        id: native
        shell: bash
        run: >-
          bash tools/runtime-bundler/verify-native-runtime.sh
          "${{ matrix.target }}" "${{ matrix.ffi_library }}" "${{ matrix.jni_library }}" "$RUNTIME_TAG"
      - name: Upload temporary platform bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.platform }}-${{ github.sha }}
          path: target/runtime-release/${{ steps.native.outputs.asset }}
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  bundles:
    name: Verify complete Runtime bundle set
    needs: [resolve, rust]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && (needs.rust.result == 'success' || needs.rust.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Download platform bundles
        if: needs.resolve.outputs.source_run == ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Download previously verified bundle set
        if: needs.resolve.outputs.source_run != ''
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-verified-${{ github.sha }}
          run-id: ${{ needs.resolve.outputs.source_run }}
          github-token: ${{ github.token }}
          path: release-assets
      - name: Reinspect and checksum release assets
        env:
          RUNTIME_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}
        run: bash tools/runtime-bundler/verify-runtime-bundles.sh release-assets "$RUNTIME_TAG" "${{ needs.resolve.outputs.source_run != '' }}"
      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-verified-${{ github.sha }}
          path: release-assets/*
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish tagged Runtime
    if: ${{ !cancelled() && needs.bundles.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    needs: bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: runtime-verified-${{ github.sha }}
          path: release-assets
      - name: Create immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Compukter Runtime ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            release-assets/*

  prepare:
    name: Prepare next development revision
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.event_name == 'push' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: runtime-next-development-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure release bot identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Prepare next version from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xtask bump revision
      - name: Verify prepared version
        run: cargo xtask check
      - name: Push development revision
        run: git push origin HEAD:main

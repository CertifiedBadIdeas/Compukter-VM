name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            ffi_library: target/release/libcompukter_ffi.so
            jni_library: target/release/libcompukter_jni.so
          - os: windows-latest
            platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            ffi_library: target/release/compukter_ffi.dll
            jni_library: target/release/compukter_jni.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo fetch --locked
      - name: Verify workspace
        shell: bash
        run: bash tools/runtime-bundler/verify-workspace.sh
      - name: Build, smoke, package and inspect native Runtime
        id: native
        shell: bash
        run: >-
          bash tools/runtime-bundler/verify-native-runtime.sh
          "${{ matrix.target }}" "${{ matrix.ffi_library }}" "${{ matrix.jni_library }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: runtime-${{ matrix.platform }}-${{ github.sha }}
          path: target/runtime-release/${{ steps.native.outputs.asset }}
          if-no-files-found: error
          retention-days: 7

  bundles:
    name: Verify complete Runtime bundle set
    needs: rust
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fetch --locked
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: runtime-*-${{ github.sha }}
          path: release-assets
          merge-multiple: true
      - name: Reinspect and checksum both platform bundles
        run: bash tools/runtime-bundler/verify-runtime-bundles.sh release-assets

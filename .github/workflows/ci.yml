name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo fetch --locked
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked --offline -- -D warnings
      - run: cargo test --workspace --locked --offline
      - run: cargo test -p compukter-vm --test golden_fixtures --locked --offline
      - run: cargo test --release --test bounded_failures --locked --offline
      - run: cargo doc --workspace --no-deps --document-private-items --locked --offline

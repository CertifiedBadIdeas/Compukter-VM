[workspace]
members = [
    ".",
    "ffi",
    "jni",
    "tools/persistence-crash-fixture",
    "tools/runtime-bundler",
    "tools/xtask",
]
resolver = "2"

[workspace.package]
version = "0.20.0"

[package]
name = "compukter-vm"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["rlib"]

[features]
persistence-crash-testing = []
guest-benchmark = []

[dependencies]
libm = { version = "=0.2.16", default-features = false }
ryu = { version = "1.0", default-features = false }
sha2 = { version = "0.10", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"

[[bin]]
name = "guest-benchmark"
path = "src/guest_benchmark.rs"
required-features = ["guest-benchmark"]
test = false
bench = false
